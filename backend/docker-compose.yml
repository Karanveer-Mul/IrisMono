services:
  postgres:
    image: postgres:15-alpine
    container_name: irismono-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: irismono
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: irismono-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # arch.md section 1: "Isolated GPU worker containers via message queue."
  # Optional in local dev - `npm run worker:dev` on the host still works and
  # is faster to iterate on - but `docker compose up worker` is what actually
  # answers the audit's finding that nothing here was containerized. See
  # Dockerfile.worker for what this process does and does not hold.
  #
  # The API is not itself containerized in this project (it runs on the host
  # via `npm run dev`), so this worker reaches it through host.docker.internal
  # rather than a compose service name. On native Linux Docker that hostname
  # needs `extra_hosts: ["host.docker.internal:host-gateway"]`; Docker
  # Desktop (Mac/Windows) provides it without any extra configuration.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: irismono-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override the host-perspective values from .env: inside this
      # container "localhost" is the container itself, not the host or its
      # sibling containers.
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
      API_BASE_URL: http://host.docker.internal:3000
      WORKER_HEALTH_PORT: "9101"
    ports:
      - "9101:9101"
    volumes:
      # Same mock-storage directory the host API process reads and writes -
      # see Dockerfile.worker.
      - ../uploads:/uploads

volumes:
  pgdata:
